
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Kart</title>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background: #151515;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }

        .dashboard {
            text-align: center;
        }

        #steerEl {
            font-size: 32px;
            font-weight: bold;
            margin: 10px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
        }

        button {
            width: 45%;
            height: 130px;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            opacity: 0.85;
        }

        button:active {
            opacity: 1;
            transform: scale(0.97);
        }

        #gas {
            background: #168b36;
        }

        #brake {
            background: #c62828;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="status" id="status">
        Conectando...
    </div>

    <div class="dashboard">
        <div>DIREÇÃO</div>
        <div id="steerEl">0.00</div>
        <div id="sensorInfo">Aguardando sensor...</div>
    </div>

    <div class="buttons">
        <button id="brake">FREIO</button>
        <button id="gas">ACELERAR</button>
    </div>

</div>

<script>
    // ==============================
    // WEBSOCKET
    // ==============================

    const params = new URLSearchParams(window.location.search);

    const servidor = params.get('server') ||
        `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;

    let ws;

    const statusEl = document.getElementById('status');

    function conectar() {
        ws = new WebSocket(servidor);

        ws.onopen = () => {
            statusEl.innerText = 'CONECTADO';
            statusEl.style.color = '#00ff66';
        };

        ws.onclose = () => {
            statusEl.innerText = 'DESCONECTADO';
            statusEl.style.color = '#ff4444';

            setTimeout(conectar, 2000);
        };

        ws.onerror = () => {
            statusEl.innerText = 'ERRO DE CONEXÃO';
        };
    }

    conectar();


    // ==============================
    // CONTROLES
    // ==============================

    let steer = 0;
    let gas = 0;
    let brake = 0;


    // ==============================
    // INCLINAÇÃO DO CELULAR
    // ==============================

    function aoInclinar(event) {

        if (event.beta === null) return;

        const angulo = screen.orientation
            ? screen.orientation.angle
            : (window.orientation || 0);

        let inclinacao = event.beta;

        // Corrige o sentido conforme a rotação da tela
        if (angulo === 270 || angulo === -90) {
            inclinacao = -event.beta;
        }

        steer = Math.max(-1, Math.min(1, inclinacao / 45));

        document.getElementById('steerEl').innerText =
            steer.toFixed(2);

        document.getElementById('sensorInfo').innerText =
            `Beta: ${event.beta.toFixed(1)} | Tela: ${angulo}°`;
    }


    // ==============================
    // PERMISSÃO DO SENSOR
    // ==============================

    async function iniciarSensor() {

        try {
            if (
                typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function'
            ) {
                const permissao =
                    await DeviceOrientationEvent.requestPermission();

                if (permissao !== 'granted') {
                    alert('Permissão do sensor negada.');
                    return;
                }
            }

            window.addEventListener('deviceorientation', aoInclinar);

        } catch (erro) {
            console.error('Erro no sensor:', erro);
        }
    }

    iniciarSensor();


    // ==============================
    // ACELERADOR
    // ==============================

    const gasButton = document.getElementById('gas');

    gasButton.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        gas = 1;
    });

    gasButton.addEventListener('pointerup', () => {
        gas = 0;
    });

    gasButton.addEventListener('pointerleave', () => {
        gas = 0;
    });

    gasButton.addEventListener('pointercancel', () => {
        gas = 0;
    });


    // ==============================
    // FREIO
    // ==============================

    const brakeButton = document.getElementById('brake');

    brakeButton.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        brake = 1;
    });

    brakeButton.addEventListener('pointerup', () => {
        brake = 0;
    });

    brakeButton.addEventListener('pointerleave', () => {
        brake = 0;
    });

    brakeButton.addEventListener('pointercancel', () => {
        brake = 0;
    });


    // ==============================
    // ENVIO DOS INPUTS
    // ==============================

    setInterval(() => {

        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(JSON.stringify({
            type: 'input',
            steer: steer,
            gas: gas,
            brake: brake
        }));

    }, 33);

</script>

</body>
</html>
